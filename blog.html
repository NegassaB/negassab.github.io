---
layout: default
title: Blog
---
<section class="blog-section" style="max-width: 800px; margin: 50px auto; padding: 20px; color: white;">
    <h1>Engineering War Stories</h1>

    <ul style="list-style: none; padding: 0;">
        {% for post in site.posts %}
        <li style="margin-bottom: 40px; border-bottom: 1px solid #333; padding-bottom: 20px;">
            <h2 style="margin-bottom: 10px;">
                <a href="{{ post.url | relative_url }}" class="post-link">{{ post.title }}</a>
            </h2>
            <p style="opacity: 0.8;">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
            <small style="opacity: 0.5;">{{ post.date | date: "%B %d, %Y" }}</small>
        </li>
        {% endfor %}
    </ul>
</section>
