    <script>
        async function loadComponent(id, file) {
            const element = document.getElementById(id);
            if (!element) {
                console.error(`Element with id "${id}" not found in this HTML file.`);
                return;
            }

            try {
                const response = await fetch(file);
                if (response.ok) {
                    element.innerHTML = await response.text();
                } else {
                    console.error(`Failed to load ${file}: ${response.status}`);
                }
            } catch (err) {
                console.error(`Fetch error for ${file}:`, err);
            }
        }

        // Use DOMContentLoaded to make sure the HTML is ready before running
        document.addEventListener("DOMContentLoaded", function () {
            // Check your URL - if you are inside /blog/, you need ../
            // If you are on the homepage, you don't.
            const prefix = window.location.pathname.includes('/blog/') ? '../' : './';

            loadComponent('site-header', prefix + 'includes/header.html');
            loadComponent('site-footer', prefix + 'includes/footer.html');
        });
    </script>
