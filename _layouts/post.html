---
layout: default
---
<article style="max-width: 800px; margin: 50px auto; padding: 20px;">
    <h1>{{ page.title }}</h1>
    <p style="color: #666;">Published on {{ page.date | date: "%B %d, %Y" }}</p>
    <hr>
    <div class="post-content">
        {{ content }}
    </div>
    <br>
    <a href="/blog">← Back to Blog</a>
</article>
