---
layout: default
---
<article class="post-container" style="max-width: 800px; margin: 50px auto; padding: 20px; color: white;">
    <h1>{{ page.title }}</h1>
    <p style="opacity: 0.6;">Published on {{ page.date | date: "%B %d, %Y" }}</p>

    <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">

    <div class="post-content">
        {{ content }}
    </div>

    <div style="margin-top: 50px;">
        <a href="/blog" class="back-link">← Back to Blog</a>
    </div>
</article>
